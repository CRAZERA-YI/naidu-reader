name: NaiDu
options:
  bundleIdPrefix: com.lingoreader
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_BITCODE: NO

targets:
  NaiDu:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: NaiDu/Sources
      - path: NaiDu/Assets.xcassets
      - path: ../app/src/main/assets/dictionary.zdb
        buildPhase: resources
      - path: ../app/src/main/assets/samples
        buildPhase: resources
        type: folder
    info:
      path: NaiDu/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingoreader.naidu
        PRODUCT_NAME: NaiDu
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - sdk: libsqlite3.tbd
      - sdk: libz.tbd
