name: Build iOS IPA (NaiDu)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-ipa:
    name: Build Unsigned iOS IPA on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ensure XcodeGen Installed
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
          xcodebuild -version

      - name: Generate Xcode Project & Compile Release App
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild build \
            -project NaiDu.xcodeproj \
            -scheme NaiDu \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA for SideStore / Sideloadly
        run: |
          APP_PATH="ios/build/Build/Products/Release-iphoneos/NaiDu.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/dictionary.zdb"
          echo "Verified dictionary.zdb bundled inside NaiDu.app"
          rm -rf build_ipa
          mkdir -p build_ipa/Payload
          cp -R "$APP_PATH" build_ipa/Payload/
          cd build_ipa
          zip -qry "../NaiDu-iOS-v1.1.0.ipa" Payload
          cd ..
          ls -lh NaiDu-iOS-v1.1.0.ipa
          IPA_BYTES=$(stat -f%z NaiDu-iOS-v1.1.0.ipa)
          echo "IPA_SIZE_BYTES=$IPA_BYTES" >> "$GITHUB_ENV"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NaiDu-iOS-Unsigned-IPA
          path: NaiDu-iOS-v1.1.0.ipa
          if-no-files-found: error

      - name: Attach IPA to GitHub Release (on Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: NaiDu-iOS-v1.1.0.ipa
          fail_on_unmatched_files: true
